
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="login-container">

<div class="icon"><img src="images/f7dc4aac-6a9c-42e3-b3f6-56ec23995dcf-removebg-preview.png" alt="train logo"style="width: 80px; height: auto"></div>

<h2>Train Reservation System</h2>
<p class="subtitle">Sign in to manage reservations and passengers</p>

<form id="loginForm">
<script>
document.addEventListener("DOMContentLoaded", () => {
    let signingIn = false;
    document.getElementById("loginForm").onsubmit = async event => {
        event.preventDefault();
        if (signingIn) return;
        signingIn = true;
        const message = document.getElementById("error");
        const button = event.submitter;
        if (button) button.disabled = true;
        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email: document.getElementById("username").value.trim(), password: document.getElementById("password").value });
            if (error) throw error;
            if (!data.session) throw Error("No session was returned. Please try signing in again.");
            window.location.href = "admin.html";
        } catch (error) { message.textContent = error.message; }
        finally { signingIn = false; if (button) button.disabled = false; }
    };
});
</script>
<label>Email</label>
<input type="email" id="username" placeholder="Enter Your Email" required>

<label>Password</label>
<input type="password" id="password" placeholder="Enter password" required>
<p style="text-align:left; margin-top:5px;">
  <a href="reset_password.html" style="color:blue; text-decoration:underline;">Forgot Password?</a>
</p>
<button type="submit">Sign In</button>
<p class="signup-link">
Don't have an account?
<a href="#" onclick="showSignup()">Sign Up</a>
</p>
<p id="error"></p>

</form>
<form id="signupForm" style="display:none;">
  <h3>Create Account</h3>

  <label>Username</label>
  <input type="text" id="newUsername" placeholder="Create a Username" required>

  <label>Email</label>
  <input type="text" id="newEmail" placeholder="Enter Your Email" required> <!-- مهم: type="text" ليطبق CSS -->

  <label>Password</label>
  <input type="password" id="newPassword" placeholder="Create a Password" required>
  <small style="color:gray; font-size:12px; display:block; margin-top:4px;">
    Password must be at least 8 characters, include a number, a symbol, and a capital letter.
  </small>

  <div class="role">
      <p>Register as</p>
      <label class="radio">
          <input type="radio" name="newRole" value="staff" checked>
          Staff
      </label>
      <label class="radio">
          <input type="radio" name="newRole" value="admin">
          Admin
      </label>
  </div>

  <div class="privacy" style="margin-top:10px;">
      <label>
          <input type="checkbox" id="privacyCheck" required>
          I agree to the 
          <a href="privacy.html" class="privacy-link">Privacy Policy</a>
      </label>
  </div>

  <button type="submit">Create Account</button>

  <p class="signup-link">
      Already have an account?
      <a href="#" onclick="showLogin()">Login</a>
  </p>

  <p id="signupError" style="color:red; margin-top:5px;"></p>
</form>


</div>
<script>
function showSignup(){
document.getElementById("loginForm").style.display="none";
document.getElementById("signupForm").style.display="block";
}

function showLogin(){
document.getElementById("signupForm").style.display="none";
document.getElementById("loginForm").style.display="block";
}

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="chatbot.js"></script>
<script src="theme-toggle.js"></script>

</body>
</html>
