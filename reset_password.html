<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
    <h2>Reset Password</h2>

    <form id="requestForm">
        <p>Enter your email and we'll send you a password reset link.</p>
        <label>Email</label>
        <input type="email" id="requestEmail" placeholder="Enter your email" required>

        <button type="submit">Send Reset Link</button>
        <p id="requestError" style="color:red; margin-top:5px;"></p>
        <p id="requestSuccess" style="color:green; margin-top:5px;"></p>
    </form>

    <form id="resetForm" style="display:none;">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" required>
        <small style="color:gray; font-size:12px; display:block; margin-top:4px;">
            Password must be at least 8 characters, include a number, a symbol, and a capital letter.
        </small>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>

        <button type="submit">Reset Password</button>
        <p id="resetError" style="color:red; margin-top:5px;"></p>
        <p id="resetSuccess" style="color:green; margin-top:5px;"></p>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
// Supabase redirects here with a recovery session already in the URL hash
// when the user arrives via the emailed reset link.
supabaseClient.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
        document.getElementById("requestForm").style.display = "none";
        document.getElementById("resetForm").style.display = "block";
    }
});

document.getElementById("requestForm").addEventListener("submit", async function(e){
    e.preventDefault();
    document.getElementById("requestError").innerText = "";
    document.getElementById("requestSuccess").innerText = "";

    const email = document.getElementById("requestEmail").value.trim();

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.href.split("#")[0]
    });

    if (error) {
        document.getElementById("requestError").innerText = error.message;
        return;
    }

    document.getElementById("requestSuccess").innerText = "Check your email for a reset link.";
});

document.getElementById("resetForm").addEventListener("submit", async function(e){
    e.preventDefault();
    document.getElementById("resetError").innerText = "";

    const newPassword = document.getElementById("newPassword").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value.trim();

    if(newPassword !== confirmPassword){
        document.getElementById("resetError").innerText = "Passwords do not match!";
        return;
    }

    const passRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*]).{8,}$/;
    if (!passRegex.test(newPassword)) {
        document.getElementById("resetError").innerText =
            "Password must be at least 8 characters, include a number, a symbol, and a capital letter.";
        return;
    }

    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    if (error) {
        document.getElementById("resetError").innerText = error.message;
        return;
    }

    document.getElementById("resetSuccess").innerText = "Password updated! Go back to login.";

    setTimeout(() => {
        window.location.href = "index.html";
    }, 2000);
});
</script>
<script src="chatbot.js"></script>
<script src="theme-toggle.js"></script>
</body>
</html>
